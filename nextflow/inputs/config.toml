[GeneratePanelData]
default_panel = 137
panelapp = "https://panelapp-aus.org/api/v1/panels"
require_pheno_match = [ "FLG", "GJB2", "F2", "F5", "HFE"]
within_x_months = 24
forbidden_genes = []
forced_panels = [ 144,]

[[GeneratePanelData.manual_overrides]]
# this section permits the manual addition of genes to the panel data
# each gene here will be folded into the panelapp data after standard API queries have taken place
# if the gene was already identified for this analysis, the MOI provided here will take precedent
# if the gene here was not identified through panelapp, a new entity will be added, and the panel ID
# associated with it will be the number zero (panel IDs must all be numeric, 0 is not in use)

# this field is mandatory - the ENSG ID of the gene
ensg = 'ENSG0000012345'

# this field should be supplied, if omitted will default to Mono_And_Biallelic
moi = 'Biallelic'

# optional - if ommitted the gene symbol will be looked up in the Ensembl data
symbol = 'AGENE'

# optional
chrom = '1'

[RunHailFiltering]
ac_threshold = 0.01
additional_csq = [ "missense", "inframe_deletion", "inframe_insertion"]
af_semi_rare = 0.01
callset_af_sv_recessive = 0.03
critical_csq = [ "frameshift", "splice_acceptor", "splice_donor", "start_lost", "stop_gained", "stop_lost",]
max_parent_ab = 0.05
minimum_depth = 10
spliceai = 0.5
csq_string = [ "consequence", "gene_id", "gene", "transcript", "mane_id", "mane", "biotype", "dna_change", "amino_acid_change", "codon", "ensp", "am_class", "am_pathogenicity",]
min_alt_depth = 5

[RunHailFiltering.de_novo]
min_child_ab = 0.2
min_depth = 5
max_depth = 1000
min_proband_gq = 25
min_alt_depth = 5

[ValidateMOI]
# callset AF filtering will only be applied to variants with this AC or higher
min_callset_ac_to_filter = 10

# Global frequency filter
# Applied to all variants regardless of MOI. Variants reported in ClinVar as P/LP are exempt from these filters
gnomad_max_af = 0.01
gnomad_sv_max_af = 0.01  # Changed from 0.03 to 0.01 to exclude common SVs (removes ~352 SVs)

# callset_* filters only apply to variants with a callset AC > min_callset_ac_to_filter.
callset_max_af = 0.01
callset_sv_max_af = 0.01  # Changed from 0.03 to 0.01 to exclude common SVs

gnomad_max_homozygotes = 5
gnomad_max_hemizygotes = 5

# Dominant frequency filters - only applied to variants being considered for a dominant MOI.
# Variants reported in ClinVar as P/LP are exempt from these filters
dominant_gnomad_max_af = 0.00001
dominant_gnomad_sv_max_af = 0.01
dominant_gnomad_max_ac = 10
dominant_gnomad_max_homozygotes = 0

# callset_* filters only apply to variants with a callset AC > min_callset_ac_to_filter.
dominant_callset_max_af = 0.01
dominant_callset_sv_max_af = 0.01
dominant_callset_max_ac = 10

# Clinvar frequency filters
# Applied to variants reported as P/LP in clinvar
clinvar_gnomad_max_af = 0.05
clinvar_dominant_gnomad_max_af = 0.00005

# callset_* filters only apply to variants with a callset AC > min_callset_ac_to_filter.
clinvar_callset_max_af = 0.05
clinvar_dominant_callset_max_af = 0.05

# any categories in this list will be ignored. For exomiser and svdb the annotations will never be annotated in
ignore_categories = [ "exomiser"]

# categories where a variant can 'support' another variant, e.g. Comp-Het, but a variant which only has categories in
# this list will not feature as a homozygous variant or dominant single hit
# IMPORTANT: Do NOT include "denovo" or "de_novo" here - de novo variants should be primary categories
support_categories = ["alphamissense", "clinvar0star"]

# variants where all applied categories are in this list are removed from the report unless the gene or variant is
# flagged as being a good phenotypic fit for the specific case
# This default value "6" (AlphaMissense) is redundant with the "support" category - variants which were only flagged by
# AlphaMissense will be removed from consideration completely
# NOTE: De novo variants are now excluded from phenotype filtering in HPOFlagging.py (code fix applied)
phenotype_match = ["AlphaMissense"]

# un-comment this to apply a minimum GQ to all samples in the trio, including WT. This will reduce de Novo prediciton
# if data was merged from single-sample VCFs (WTs/absent from single sample VCF will be inserted as WT/GQ=0)
#min_all_sample_gq = 15

[HPOFlagging]
semantic_match = true
min_similarity = 14.0

[StructuralVariantFiltering]
# Structural variant filtering configuration
# Applied during ValidateMOI after MOI validation

# Filter intronic SVs (those without exon overlap)
# If true: keep only SVs with exon_overlap_bp > 0 OR are part of compound hets
# If false: keep all SVs that pass MOI validation
filter_intronic_svs = true

# Minimum exon overlap in base pairs to consider an SV as exonic
# SVs with exon_overlap_bp >= this threshold are always kept
min_exon_overlap_bp = 1

# Additional filtering for intronic compound het SVs
# These filters only apply to SVs that:
# - Have NO exon overlap (exon_overlap_bp = 0)
# - Are part of a compound het

# Minimum size for intronic compound het SVs (in bp)
# Intronic comp-het SVs smaller than this will be filtered out
# Set to 0 to disable size filtering
min_intronic_comp_het_size = 10000

# SV types allowed for intronic compound hets
# Options: DEL, CNV, DUP, INS, INV
# CNVs are often less specific, so you may want to exclude them
# Only allowing deletions as they have the clearest impact
allowed_intronic_comp_het_types = ["DEL"]

# Gene overlap requirement (applied during categorization)
require_gene_overlap = true

# Exon overlap requirement (strict - filters out ALL SVs without exon overlap)
# Setting to true removes: 91 SVs (25 DEL + 58 BND + 8 INS)
# All 488 CNVs have exon overlap, 92 DELs have exon overlap
require_exon_overlap = true

# Phenotype matching requirement
require_phenotype_match = false

# Minimum phenotype match score (0-100)
# Represents percentage of patient HPO terms matched
min_phenotype_score = 0.0

# SV types to include (options: DEL, CNV, INS, DUP, INV, BND)
# Excluding INS (small, no exon overlap, 100% common) and BND (breakends, no exon overlap)
# Note: BND and INS currently leak through (8 INS + 58 BND in report) - need workflow fix
allowed_sv_types = ["DEL", "CNV"]

# Quality filtering
require_pass_only = true

# Size filtering (in base pairs)
# Current distribution: CNV median=3kb, DEL median=2.9kb
# Setting min=1000 keeps most variants while excluding very small calls
# Alternative strategies:
#   - min_sv_size = 5000: Would remove 313 additional CNVs (313/488 = 64%)
#   - min_sv_size = 50: Would include 11 more small DELs
min_sv_size = 1000
max_sv_size = 0  # 0 means no maximum

# Additional filtering notes (2025-10-13 analysis):
# Current 671 SVs breakdown:
#   - 488 CNV (100% have exon overlap, 56.6% common AF>1%)
#   - 117 DEL (78.6% have exon overlap, 29.9% common)
#   - 8 INS (0% exon overlap, 100% common) - EXCLUDED by type filter
#   - 58 BND (0% exon overlap, 56.9% common) - EXCLUDED by type filter
#
# Potential additional filters to consider:
#   1. Exclude common variants: filter_intronic_svs + AF filter removes ~352 SVs
#   2. Require exon overlap: Would remove 91 more SVs (15% of current)
#   3. Increase CNV min size to 5kb: Would remove 313 CNVs (leaves 175)
