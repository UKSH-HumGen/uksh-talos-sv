name: CI_lint
on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache-dependency-path: requirements-lint.txt

    - name: Install types
      run: pip install -r requirements-lint.txt

    - name: pre-commit
      run: pre-commit run --all-files
