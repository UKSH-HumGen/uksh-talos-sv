name: CI_test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install package and test extras
      # cpg-utils is now an optional extra. The default install is enough to
      # run the test suite. Re-add ".[cpg]" if you need cpg-utils for Google
      # Cloud Hail/Batch initialisation.
      run: |
        pip install ".[test]"

    - name: test
      # pytest-xdist is in the [test] extra; -n auto enables parallel runs.
      run: pytest -n auto .
